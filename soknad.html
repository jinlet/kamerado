<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Søknadsskjema - Kamerado</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="icon" href="images/favicon.ico">
</head>
<body>
    <div class="form-page">
        <div class="container">

            <div class="form-page-header">
                <a href="index.html" class="back-btn">
                    <i class="fa fa-arrow-left"></i>
                    Tilbake
                </a>
                <h1>Søknadsskjema Kamerado</h1>
            </div>

            <div class="form-card">
                <form action="https://formspree.io/f/mkndlvqa" method="POST">

                    <div class="field-grid">
                        <div class="form-field">
                            <label>Prosjekttittel</label>
                            <input type="text" class="form-control" name="Prosjekttittel" required>
                        </div>
                        <div class="form-field">
                            <label>Søkerorganisasjon</label>
                            <input type="text" class="form-control" name="Søkerorganisasjon" required>
                        </div>
                        <div class="form-field">
                            <label>Prosjektleder</label>
                            <input type="text" class="form-control" name="Prosjektleder" required>
                        </div>
                        <div class="form-field">
                            <label>Kontaktinformasjon</label>
                            <input type="text" class="form-control" name="Kontaktinformasjon" required>
                        </div>
                        <div class="form-field">
                            <label>Søknadssum</label>
                            <input type="text" class="form-control" placeholder="Inntil kr 200.000,-" name="Søknadssum" required>
                        </div>
                        <div class="form-field">
                            <label>Kontonummer</label>
                            <input type="text" class="form-control" name="Kontonummer" required>
                        </div>
                    </div>

                    <div class="form-divider"></div>

                    <div class="questions-grid">
                        <div class="form-field">
                            <label>1. Bakgrunn for prosjektet/tiltaket</label>
                            <textarea class="form-control" name="1. Bakgrunn for prosjektet/tiltaket" placeholder="Beskriv og underbygg behovet eller problemet som ligger til grunn for prosjektet." required></textarea>
                        </div>
                        <div class="form-field">
                            <label>2. Beskrivelse av prosjektet</label>
                            <textarea class="form-control" name="2. Beskrivelse av prosjektet" placeholder="Hva har dere tenkt å gjøre og hvilke planer har dere for gjennomføringen? Det må være samsvar mellom aktivitet og økonomi i prosjektet." required></textarea>
                        </div>
                        <div class="form-field">
                            <label>3. Målsetting for prosjektet/tiltaket</label>
                            <textarea class="form-control" name="3. Målsetting for prosjektet/tiltaket" placeholder="Hva er hovedmålet og resultatmålet for prosjektet?" required></textarea>
                        </div>
                        <div class="form-field">
                            <label>4. Antall personer dere planlegger å få med/eller nå</label>
                            <input type="number" class="form-control" name="4. Antall personer dere planlegger å få med/eller nå" required>
                        </div>
                        <div class="form-field">
                            <label>5. Hvilke resultater forventer dere å oppnå</label>
                            <textarea class="form-control" name="5. Hvilke resultater forventer dere å oppnå" placeholder="Resultater på lang og kort sikt?" required></textarea>
                        </div>
                        <div class="form-field">
                            <label>6. Ser dere noen eventuelle utfordringer i prosjektet?</label>
                            <textarea class="form-control" name="6. Ser dere noen eventuelle utfordringer i prosjektet?" placeholder="Beskriv hvilke utfordringer dere ser i prosjektet, for eksempel i gjennomføring eller for å oppnå resultatmålene. Beskriv også hvordan dere vil løse disse utfordringene dersom de oppstår." required></textarea>
                        </div>
                        <div class="form-field">
                            <label>7. Budsjett</label>
                            <textarea class="form-control" name="7. Budsjett" placeholder="Hva skal midlene brukes til? Sett opp et konkret budsjett over hvilke summer av det omsøkte beløpet som skal brukes til hva." required></textarea>
                        </div>
                        <div class="form-field">
                            <label>8. Andre finansieringskilder</label>
                            <textarea class="form-control" name="8. Andre finansieringskilder" placeholder="Har prosjektet andre finansieringskilder? Og i så fall hvilke? Hva er totalbudsjettet?" required></textarea>
                        </div>
                    </div>

                    <div class="submit-row">
                        <button type="submit" class="btn">Send inn søknad</button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</body>
</html>
