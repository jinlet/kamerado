<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapporteringsskjema - Kamerado</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="icon" href="images/favicon.ico">
</head>
<body>
    <div class="form-page">
        <div class="container">

            <div class="form-page-header">
                <a href="index.html" class="back-btn">
                    <i class="fa fa-arrow-left"></i>
                    Tilbake
                </a>
                <h1>Rapporteringsskjema</h1>
            </div>

            <div class="form-card">
                <form action="https://formspree.io/f/mkndlvqa" method="POST">

                    <div class="field-grid">
                        <div class="form-field field-full">
                            <label>Navn på organisasjon/enkeltperson</label>
                            <input type="text" class="form-control" name="Navn på organisasjon/enkeltperson" required>
                        </div>
                        <div class="form-field field-full">
                            <label>Navn på prosjekt</label>
                            <input type="text" class="form-control" name="Navn på prosjekt" required>
                        </div>
                        <div class="form-field">
                            <label>Sum tildelt fra Kamerado</label>
                            <input type="text" class="form-control" name="Sum tildelt fra Kamerado" required>
                        </div>
                        <div class="form-field">
                            <label>Antall deltakere fra målgruppen</label>
                            <input type="text" class="form-control" name="Antall deltakere fra målgruppa som har deltatt i prosjektet?" required>
                        </div>
                        <div class="form-field field-full">
                            <label>Andre deltakere utenfor målgruppen (valgfritt)</label>
                            <input type="text" class="form-control" name="Andre deltakere utenfor målgruppen som benyttet seg av tilbudet?">
                        </div>
                    </div>

                    <div class="form-divider"></div>

                    <div class="questions-grid">
                        <div class="form-field">
                            <label>1. GI EN UTFYLLENDE BESKRIVELSE AV AKTIVITETENE DERE HAR GJENNOMFØRT</label>
                            <textarea class="form-control" name="1. GI EN UTFYLLENDE BESKRIVELSE AV AKTIVITETENE DERE HAR GJENNOMFØRT" placeholder="Hva er gjort i prosjektperioden? Hvem har deltatt og hvor mange? Er det gjennomført flere aktiviteter i prosjektperioden skal hver aktivitet spesifiseres med måltall." required></textarea>
                        </div>
                        <div class="form-field">
                            <label>2. MÅLOPPNÅELSE FOR TILTAKET/RESULTATMÅL</label>
                            <textarea class="form-control" name="2. MÅLOPPNÅELSE FOR TILTAKET/RESULTATMÅL" placeholder="Redegjør for tiltakets måloppnåelse. Beskriv også hvilke mål som eventuelt ikke ble oppnådd." required></textarea>
                        </div>
                        <div class="form-field">
                            <label>3. BESKRIV REKRUTTERING AV MÅLGRUPPEN</label>
                            <textarea class="form-control" name="3. BESKRIV REKRUTTERING AV MÅLGRUPPEN" placeholder="Redegjør for hvordan målgruppen ble rekruttert til tiltaket. Hvordan kom dere i kontakt med deltakerne? Klarte dere å rekruttere de gruppene dere ønsket å nå?" required></textarea>
                        </div>
                        <div class="form-field">
                            <label>4. OPPGI ALLE SAMARBEIDSPARTNERE OG BESKRIV SAMARBEID OG ROLLER KORT</label>
                            <input class="form-control" name="4. OPPGI ALLE SAMARBEIDSPARTNERE OG BESKRIV SAMARBEID OG ROLLER KORT" required>
                        </div>
                        <div class="form-field">
                            <label>5. BESKRIV EVENTUELT UTFORDRINGER OG SUKSESSKRITERIER</label>
                            <textarea class="form-control" name="5. BESKRIV EVENTUELT UTFORDRINGER OG SUKSESSKRITERIER" placeholder="Har det vært noen spesielle utfordringer i tiltaket? Hva har fungert spesielt godt?" required></textarea>
                        </div>
                        <div class="form-field">
                            <label>6. GODE HISTORIER</label>
                            <textarea class="form-control" name="6. GODE HISTORIER" placeholder="Gjengi en eller flere historier og/eller gode møter som gjorde inntrykk. Dokumenter gjerne med bilder." required></textarea>
                        </div>
                        <div class="form-field">
                            <label>7. VIDEREFØRING</label>
                            <textarea class="form-control" name="7. VIDEREFØRING" placeholder="Beskriv hvordan prosjektet evt. skal videreføres, eller evt. hvordan resultater fra prosjektet skal spres." required></textarea>
                        </div>
                        <div class="form-field">
                            <label>8. ANDRE KOMMENTARER OG/ELLER TING DU ØNSKER Å BELYSE</label>
                            <textarea class="form-control" name="8. ANDRE KOMMENTARER OG/ELLER TING DU ØNSKER Å BELYSE"></textarea>
                        </div>
                        <div class="form-field">
                            <label>9. REGNSKAP</label>
                            <textarea class="form-control" name="9. REGNSKAP" placeholder="Sett opp et regnskap som viser brukte midler opp mot oppsatt budsjett.
Kvitteringer kreves for innkjøp av større øremerkede ting.
Vi krever ikke kvitteringer på innkjøp gitt til mindre prosjekter."></textarea>
                        </div>
                    </div>

                    <div class="submit-row">
                        <button type="submit" class="btn">Send inn skjema</button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</body>
</html>
